# Workflow GitHub Actions - invio email riepilogo quotidiano con PDF
name: Invia Riepilogo Giornaliero

on:
  schedule:
    # Ogni giorno alle 05:00 UTC = 07:00 CEST (Italia)
    - cron: "0 5 * * *"
  # Permette esecuzione manuale dal pulsante "Run workflow" su GitHub
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze di sistema (weasyprint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2 2>&1 | tail -1
          pip install --quiet weasyprint
          python -c "from weasyprint import HTML; print('weasyprint OK')"

      - name: Verifica file .env
        run: |
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" > .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> .env

      - name: Invia email di riepilogo (con PDF allegato)
        env:
          TZ: Europe/Rome
        run: python scripts/invia_riepilogo.py

      - name: Log completamento
        if: always()
        run: echo "Workflow completato il $(date)"