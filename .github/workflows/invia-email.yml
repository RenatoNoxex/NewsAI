name: Invia Riepilogo Giornaliero

on:
  schedule:
    # Ogni giorno alle 05:00 UTC = 07:00 CEST (Italia)
    - cron: "0 5 * * *"
  # Permette esecuzione manuale dal pulsante "Run workflow" su GitHub
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install --quiet zoneinfo 2>/dev/null || true

      - name: Verifica file .env e articles.json
        run: |
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" > .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> .env

      - name: Invia email di riepilogo
        env:
          TZ: Europe/Rome
        run: python scripts/invia_riepilogo.py

      - name: Log completamento
        if: always()
        run: echo "Workflow completato il $(date)"