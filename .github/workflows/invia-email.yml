# Workflow GitHub Actions - invio email riepilogo quotidiano
name: Invia Riepilogo Giornaliero

on:
  schedule:
    # Ogni giorno alle 05:00 UTC = 07:00 CEST (Italia)
    - cron: "0 5 * * *"
  # Permette esecuzione manuale dal pulsante "Run workflow" su GitHub
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          # zoneinfo è incluso in Python 3.9+ (usiamo 3.11)
          python -c "from zoneinfo import ZoneInfo; print('zoneinfo OK')"

      - name: Debug articles.json
        run: |
          echo "Contenuto articles.json (prime 300 righe):"
          python -c "import json; d=json.load(open('data/articles.json')); print(f'Articoli: {len(d.get(\"articles\",[]))}')"
          head -5 data/articles.json

      - name: Verifica file .env e articles.json
        run: |
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" > .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> .env

      - name: Invia email di riepilogo
        env:
          TZ: Europe/Rome
        run: python scripts/invia_riepilogo.py

      - name: Log completamento
        if: always()
        run: echo "Workflow completato il $(date)"